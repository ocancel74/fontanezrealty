<!doctype html>
<html lang="es">
<head>
  <script>
    // Capture the raw URL hash before anything else on the page (including
    // the Identity widget script) has a chance to touch it — in practice it
    // gets rewritten to "#/" almost immediately once that script loads.
    window.__authHash = window.location.hash;
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel administrativo — Joe Fontanez Real Estate</title>
  <!-- Warm up the connection to the Identity/Git Gateway project early —
       it's a different domain than this CMS, and every millisecond here
       reduces the odds of Decap's internal init race (see below) firing. -->
  <link rel="preconnect" href="https://fontanezrealty-cms.netlify.app" crossorigin>
  <link rel="dns-prefetch" href="https://fontanezrealty-cms.netlify.app">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />
  <style>
    body { font-family: -apple-system, sans-serif; }
    #nc-root .css-1a1044o-Loader-defaultLoaderStyles { border-color: #b8925a transparent transparent transparent !important; }

    #set-password-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(30, 30, 30, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #set-password-card {
      background: #fff;
      border-radius: 8px;
      padding: 32px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 48px rgba(0,0,0,0.25);
    }
    #set-password-card h2 { margin: 0 0 8px; font-size: 1.2rem; color: #1a1a1a; }
    #set-password-card p { margin: 0 0 20px; font-size: 0.88rem; color: #666; }
    #set-password-card input {
      width: 100%; box-sizing: border-box; padding: 10px 12px; margin-bottom: 12px;
      border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem;
    }
    #set-password-card button {
      width: 100%; padding: 11px; background: #1a1a1a; color: #fff; border: none;
      border-radius: 4px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    #set-password-card button:disabled { opacity: 0.6; cursor: default; }
    #set-password-error { color: #a94442; font-size: 0.85rem; margin: -4px 0 12px; display: none; }
    #set-password-success { color: #3f7d5c; font-size: 0.9rem; margin: -4px 0 12px; display: none; }
  </style>
</head>
<body>
  <!--
    Login: Netlify Identity + Git Gateway. The Netlify project below exists
    only to run Identity/Git Gateway — GitHub Pages still hosts the public
    site. Manage who can log in from that project's Identity tab.
  -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    var IDENTITY_URL = "https://fontanezrealty-cms.netlify.app/.netlify/identity";

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function (user) {
        if (!user) {
          window.netlifyIdentity.on("login", function () {
            document.location.href = "./";
          });
        }
      });
      window.netlifyIdentity.init({ APIUrl: IDENTITY_URL });

      // Decap CMS's git-gateway backend races the widget's own "init" event
      // against a 2.5s timeout; if our cross-domain identity settings fetch
      // hasn't finished by then (slower than same-origin, since it's a
      // separate Netlify project), Decap impatiently calls
      // netlifyIdentity.init() again with NO options, silently resetting it
      // to same-origin defaults and breaking everything ("No se pudo
      // acceder a la configuración de Identity"). Re-assert our config
      // afterwards so ours always wins the race, regardless of network
      // timing.
      setTimeout(function () {
        window.netlifyIdentity.init({ APIUrl: IDENTITY_URL });
      }, 3000);
    }

    // netlify-identity-widget's own automatic handling of #invite_token /
    // #recovery_token / #confirmation_token / #email_change_token renders
    // its "set password" form inside an internal iframe that, in this
    // cross-domain setup (CMS on GitHub Pages, Identity on Netlify), ends up
    // empty — the state updates but nothing visible ever appears, leaving
    // no way to set a password. Bypassing it entirely with our own minimal
    // form that calls the same underlying Identity REST endpoint directly.
    (function () {
      var GOTRUE_TYPE = { confirmation: "signup", invite: "signup", recovery: "recovery", email_change: "email_change" };
      var match = (window.__authHash || "").match(/(confirmation|invite|recovery|email_change)_token=([^&]+)/);
      if (!match) return;

      var token = match[2];
      var gotrueType = GOTRUE_TYPE[match[1]];
      var isRecovery = match[1] === "recovery";

      var overlay = document.createElement("div");
      overlay.id = "set-password-overlay";
      overlay.innerHTML =
        '<div id="set-password-card">' +
        "<h2>" + (isRecovery ? "Restablecer tu contraseña" : "Crear tu contraseña") + "</h2>" +
        "<p>" + (isRecovery ? "Escribe tu nueva contraseña para el panel administrativo." : "Ya casi — elige una contraseña para entrar al panel administrativo.") + "</p>" +
        '<div id="set-password-error"></div>' +
        '<div id="set-password-success"></div>' +
        '<input type="password" id="set-password-input" placeholder="Contraseña (mínimo 6 caracteres)" autocomplete="new-password" />' +
        '<button type="button" id="set-password-submit">Guardar contraseña</button>' +
        "</div>";
      document.body.appendChild(overlay);

      document.getElementById("set-password-submit").addEventListener("click", function () {
        var btn = this;
        var input = document.getElementById("set-password-input");
        var errorEl = document.getElementById("set-password-error");
        var successEl = document.getElementById("set-password-success");
        errorEl.style.display = "none";
        successEl.style.display = "none";

        var password = input.value;
        if (!password || password.length < 6) {
          errorEl.textContent = "La contraseña debe tener al menos 6 caracteres.";
          errorEl.style.display = "block";
          return;
        }

        btn.disabled = true;
        btn.textContent = "Guardando…";

        fetch(IDENTITY_URL + "/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: gotrueType, token: token, password: password })
        })
          .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
          .then(function (result) {
            if (!result.ok) throw new Error((result.data && result.data.msg) || "No se pudo completar.");
            successEl.textContent = "¡Listo! Tu contraseña quedó creada. Redirigiendo al login…";
            successEl.style.display = "block";
            input.style.display = "none";
            btn.style.display = "none";
            setTimeout(function () {
              window.location.href = window.location.pathname;
            }, 1800);
          })
          .catch(function (err) {
            errorEl.textContent = err.message || "No se pudo completar. El link puede haber vencido — pide una invitación nueva.";
            errorEl.style.display = "block";
            btn.disabled = false;
            btn.textContent = "Guardar contraseña";
          });
      });
    })();
  </script>

  <!-- Decap CMS (git-based, no traditional backend). Configuration: admin/config.yml -->
  <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
  <script>
    // Adds a "Dashboard" link to the CMS top bar (read-only counts, see admin/dashboard.html).
    if (window.CMS && typeof window.CMS.registerAdditionalLink === "function") {
      window.CMS.registerAdditionalLink({
        id: "dashboard",
        title: "Dashboard",
        data: "dashboard.html",
        options: { icon: "dashboard" }
      });
    }
  </script>
</body>
</html>
