<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel administrativo — Joe Fontanez Real Estate</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />
  <style>
    body { font-family: -apple-system, sans-serif; }
    #nc-root .css-1a1044o-Loader-defaultLoaderStyles { border-color: #b8925a transparent transparent transparent !important; }
  </style>
</head>
<body>
  <!--
    Login: Netlify Identity + Git Gateway. The Netlify project below exists
    only to run Identity/Git Gateway — GitHub Pages still hosts the public
    site. Manage who can log in from that project's Identity tab.
  -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function (user) {
        if (!user) {
          window.netlifyIdentity.on("login", function () {
            document.location.href = "./";
          });
        }
      });
      window.netlifyIdentity.init({
        APIUrl: "https://fontanezrealty-cms.netlify.app/.netlify/identity"
      });
    }
  </script>

  <!-- Decap CMS (git-based, no traditional backend). Configuration: admin/config.yml -->
  <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
  <script>
    // Adds a "Dashboard" link to the CMS top bar (read-only counts, see admin/dashboard.html).
    if (window.CMS && typeof window.CMS.registerAdditionalLink === "function") {
      window.CMS.registerAdditionalLink({
        id: "dashboard",
        title: "Dashboard",
        data: "dashboard.html",
        options: { icon: "dashboard" }
      });
    }
  </script>
</body>
</html>
